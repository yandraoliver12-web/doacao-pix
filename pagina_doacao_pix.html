<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7efe3">
  <title>Ajude com sua doação 💚</title>
  <style>
    :root { color-scheme: light; --green:#426344; --dark:#29482d; --pale:#e7efe3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: linear-gradient(145deg, #f7faf5, var(--pale));
      color: var(--dark); font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 440px); background: rgba(255,255,255,.94);
      border: 1px solid #d6e2d2; border-radius: 26px; padding: 30px 24px;
      text-align: center; box-shadow: 0 18px 50px rgba(41,72,45,.10);
    }
    .heart { font-size: 46px; line-height: 1.2; margin-bottom: 12px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.7rem, 7vw, 2.1rem); line-height: 1.15; }
    .message { margin: 0 auto 24px; max-width: 32ch; color: #4e6250; line-height: 1.6; }
    .pix-card { border: 1px solid #dce6d8; border-radius: 18px; padding: 18px; background: #f8fbf6; }
    .label { font-size: .85rem; color: #617262; margin: 0 0 8px; }
    .key {
      overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: .96rem; line-height: 1.5; margin: 0 0 16px; color: #243d27;
    }
    button {
      border: 0; width: 100%; padding: 15px 18px; border-radius: 12px;
      background: var(--green); color: white; font: inherit; font-weight: 700;
      cursor: pointer; transition: transform .12s ease, background .12s ease;
    }
    button:hover { background: #345337; }
    button:active { transform: scale(.99); }
    button:focus-visible { outline: 3px solid #a4c69f; outline-offset: 3px; }
    #status { min-height: 1.4em; margin: 12px 0 0; font-size: .9rem; color: #345337; }
    .note { margin: 18px 0 0; font-size: .78rem; color: #748174; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="heart" aria-hidden="true">💚</div>
    <h1>Ajude com sua doação</h1>
    <p class="message">Qualquer valor faz a diferença. Agradeço de coração pela sua contribuição!</p>
    <section class="pix-card" aria-label="Dados para doação via Pix">
      <p class="label">CHAVE PIX</p>
      <p class="key" id="pix-key">6dbd49cc-1b7f-4179-9b1e-6e07031b2544</p>
      <button id="copy-button" type="button">Copiar chave Pix</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <p class="note">Obrigada por apoiar. Antes de confirmar a transferência, confira os dados do destinatário exibidos pelo seu banco.</p>
  </main>
  <script>
    const pixKey = "6dbd49cc-1b7f-4179-9b1e-6e07031b2544";
    const button = document.getElementById("copy-button");
    const status = document.getElementById("status");

    async function copyPixKey() {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(pixKey);
        } else {
          const field = document.createElement("textarea");
          field.value = pixKey;
          field.setAttribute("readonly", "");
          field.style.position = "fixed";
          field.style.opacity = "0";
          document.body.appendChild(field);
          field.select();
          const copied = document.execCommand("copy");
          field.remove();
          if (!copied) throw new Error("copy failed");
        }
        status.textContent = "Chave Pix copiada! Agora é só colar no seu banco.";
        button.textContent = "Chave copiada ✓";
      } catch (error) {
        status.textContent = "Não foi possível copiar automaticamente. Pressione e segure a chave acima para copiá-la.";
      }
    }

    button.addEventListener("click", copyPixKey);
  </script>
</body>
</html>
